services:
  postgres:
    image: postgres:16
    container_name: fhir_dw_postgres
    environment:
      POSTGRES_DB: fhir_dw
      POSTGRES_USER: fhir
      POSTGRES_PASSWORD: fhir
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir -d fhir_dw"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
